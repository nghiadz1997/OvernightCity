<head>

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%232563eb'/><path d='M30 45 L50 65 L70 35' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Font Awesome Icons 6 -->

  <!-- Trình bắt lỗi và tự phục hồi an toàn -->
  <script>
    window.onerror = function(msg, url, line, col, error) {
      console.error('JS Error:', msg, url, line);
      setTimeout(function() {
        const main = document.getElementById('app-main');
        if (main && !main.innerHTML.trim() && typeof HomePage !== 'undefined') {
          main.innerHTML = HomePage.render();
        }
      }, 50);
    };
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
              950: '#0f172a'
            }
          }
        }
      }
    }
  </script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- SheetJS (XLSX) for Excel Export -->

  <!-- Firebase Client SDKs (Compat v10 for maximum reliable client-side execution) -->

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
